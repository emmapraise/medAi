description = "Medical QA Bot powered by Qdrant Hybrid Search & Groq LLMs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "minsearch>=0.2.0",
    "openai>=2.48.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.1",
]
