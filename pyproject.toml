[project]
name = "mediqa-bot"
version = "0.1.0"
description = "Medical QA Bot powered by Qdrant hybrid search and a LangGraph corrective-RAG agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-openai>=1.4.1",
    "langfuse>=4.14.4",
    "langgraph>=1.2.10",
    "minsearch>=0.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "openai>=2.48.0",
    "optimum[onnxruntime]>=1.24.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "requests>=2.34.2",
    "sentence-transformers[onnx]>=3.0.0",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "jupyter>=1.1.1",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["E501", "S101", "B008", "UP042"]
