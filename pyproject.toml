[project]
name = "mediqa-bot"
version = "0.1.0"
description = "Medical QA Bot powered by Qdrant hybrid search and a LangGraph corrective-RAG agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "google-genai>=1.0.0",
    "openai>=2.48.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
# Needed only to build or refresh the search index (python -m app.services.search_v2) and the eval cases.
ingest = ["pandas>=3.0.5"]
# Only for re-running the v1 baseline in eval/run_retrieval.py. This is where torch comes from.
baseline = [
    "langfuse>=4.14.4",
    "onnx>=1.16.0",
    "optimum[onnxruntime]>=1.24.0",
    "pandas>=3.0.5",
    "sentence-transformers[onnx]>=3.0.0",
]
dev = [
    { include-group = "ingest" },
    "httpx>=0.28.0",
    "jupyter>=1.1.1",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["E501", "S101", "B008", "UP042"]
